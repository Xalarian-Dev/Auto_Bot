# Contrôle automatique des pull requests (étape 1 du ticket #17).
# Garde-fous : ne lance JAMAIS le bot (ni main.py --mode, ni app.py), n'utilise aucun secret
# ni identifiant réel, n'envoie rien vers l'extérieur. Seule sortie réseau : l'installation des
# bibliothèques publiques (lecture seule).
name: Vérifications

on:
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    env:
      # Clés forcées à vide : même un import mal écrit ne pourrait appeler aucun service.
      ANTHROPIC_API_KEY: ""
      SERPAPI_KEY: ""
      USAJOBS_KEY: ""
      USAJOBS_EMAIL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les bibliothèques
        run: pip install -r requirements.txt ruff
      - name: Les fichiers Python se compilent
        run: python -m compileall -q main.py app.py scout drafter config assets tests
      - name: Erreurs graves (ruff)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Les modules principaux s'importent
        run: |
          python - <<'PY'
          import importlib
          for m in ["main", "scout.runner", "scout.scorer", "scout.db", "config.profile_generator", "drafter.writer"]:
              importlib.import_module(m)
              print("ok", m)
          PY
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
