# ============================================================
# Scout Agent — Mode Profiles
# Human-readable config. Edit here, save from the dashboard.
# criteria.yaml is auto-generated from this file.
# ============================================================

modes:

  # ============================================================
  # MODE A — APAC
  # ============================================================
  A:
    label: "APAC"
    search_suffix: "relocation visa sponsorship"

    keywords:
      - "Program Director"
      - "Head of PMO"
      - "Transformation Director"
      - "Delivery Director"

    # name = used as serpapi location field and display
    # country = used for region inference and jaabz/jobbank queries
    # indeed_domain = only needed for Mode C (Indeed EU)
    locations:
      - name: "Singapore"
        country: "Singapore"
      - name: "Sydney, Australia"
        country: "Australia"
      - name: "Melbourne, Australia"
        country: "Australia"
      - name: "Hong Kong"
        country: "Hong Kong"
      - name: "Tokyo, Japan"
        country: "Japan"
      - name: "Ho Chi Minh City, Vietnam"
        country: "Vietnam"
      - name: "Bangkok, Thailand"
        country: "Thailand"

    sources:
      serpapi: true
      mcf: false      # MyCareersFuture — requires SingPass (Singapore citizens only)
      jaabz: true     # Relocation-focused board
      globaljobs: true
      greenhouse: true
      usajobs: false
      jobbank: false
      itjobboard: false
      indeed: false

    greenhouse_companies:
      - token: "thoughtworks"
        name: "Thoughtworks"
      - token: "gitlab"
        name: "GitLab"
      - token: "airbnb"
        name: "Airbnb"
      - token: "databricks"
        name: "Databricks"
      - token: "stripe"
        name: "Stripe"
      - token: "elastic"
        name: "Elastic"
      - token: "okta"
        name: "Okta"
      - token: "cloudflare"
        name: "Cloudflare"
      - token: "datadog"
        name: "Datadog"
      - token: "canonical"
        name: "Canonical"
      - token: "figma"
        name: "Figma"
      - token: "anthropic"
        name: "Anthropic"
      - token: "riotgames"
        name: "Riot Games"
      - token: "epicgames"
        name: "Epic Games"
      - token: "contentful"
        name: "Contentful"
      - token: "algolia"
        name: "Algolia"
      - token: "braze"
        name: "Braze"

    greenhouse_title_filters:
      - "Program Manager"
      - "Program Director"
      - "Project Director"
      - "Head of PMO"
      - "PMO"
      - "Delivery Manager"
      - "Delivery Director"
      - "Engagement Manager"
      - "Transformation"

